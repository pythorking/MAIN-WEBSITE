<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snowy Days Slalom</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#bfdbfe;font-family:'Fredoka',system-ui;overflow:hidden;touch-action:none}
#wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(90% 70% at 50% 0%,#dbeafe 0%,#bfdbfe 35%,#93c5fd 100%)}
canvas{background:#fff;border-radius:28px;box-shadow:0 30px 80px rgba(15,23,42,.25),0 0 0 10px rgba(255,255,255,.9) inset;max-width:96vw;max-height:94vh;aspect-ratio:540/820}
#hud{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.pill{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:7px 14px;border-radius:999px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.14);font-size:13px;border:1px solid white}
#ctrl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px}
.b{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.97);border:2px solid white;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:22px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(191,219,254,.72);backdrop-filter:blur(22px)}
.card{background:white;border-radius:26px;padding:26px 22px;max-width:410px;width:90%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.cta{background:#0f172a;color:white;border:0;padding:13px 26px;border-radius:999px;font-family:'Fredoka';font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
.badge{display:inline-block;background:#e0f2fe;color:#0369a1;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;margin:2px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="540" height="820"></canvas>
<div id="hud"><div class="pill">🚩 <b id="gc">0</b></div><div class="pill">⚡ <b id="sp">0</b></div><div class="pill">🧭 <b id="np">800m</b></div><div class="pill" id="ice" style="display:none;background:#bae6fd">🧊 SLIP</div></div>
<div id="ctrl"><button class="b" id="L">◀</button><button class="b" id="T">⬇</button><button class="b" id="R">▶</button></div>
<div id="overlay"><div class="card" id="card"><h1>SNOWY<br><span style="color:#0ea5e9">DAYS</span><br>SLALOM</h1><p><b>Slow start</b>, first gate is far (800m) but you can see it from the top. Miss = instant out.</p><div><span class="badge">🌲 Tree</span><span class="badge">⛄ Snowman</span><span class="badge">🧊 Ice</span><span class="badge">🪨 Rock</span></div><p style="font-size:12px;margin-top:10px">A/D or ◀▶ = carve (hold to build edge)<br>S = tuck for speed • Drag to steer</p><button class="cta" id="play">DROP IN ▶</button></div></div>
</div>
<script>
const W=540,H=820, canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let keys={}, mouseDown=false, mouseX=W/2, game='menu', t=0, worldY=0, gates=[], obstacles=[], tracks=[], snow=[], particles=[], gatesPassed=0, iceT=0, skier;
const rand=(a,b)=>Math.random()*(b-a)+a;
function reset(){
  skier={x:W/2,vx:0,edge:0,lean:0,base:1.6,speed:1.6,crash:0,inv:0,y:H*0.78};
  worldY=0; gates=[]; obstacles=[]; tracks=[]; particles=[]; gatesPassed=0; iceT=0; t=0;
  let y=800; // first gate far but visible
  for(let i=0;i<35;i++){ spawn(y); y+=rand(500,700); }
  snow=[]; for(let i=0;i<180;i++) snow.push({x:rand(0,W),y:rand(0,H),r:rand(0.8,3.2),s:rand(0.4,1.6),a:rand(0.4,0.9),d:rand(-0.4,0.4)});
}
function spawn(wy){
  const gap=rand(165,215); const cx=rand(90+gap/2,W-90-gap/2);
  gates.push({wy,x:cx,gap,left:cx-gap/2,right:cx+gap/2,passed:false});
  for(let k=0;k<2;k++){
    let ow=wy - rand(140,360); if(ow<400) continue;
    let r=Math.random(); let type=r<.35?'tree':r<.55?'rock':r<.73?'snowman':r<.87?'ice':'mogul';
    let ox= type==='ice'? rand(50,W-50) : (Math.random()<.5? rand(18,cx-gap/2-38) : rand(cx+gap/2+38,W-18));
    obstacles.push({type,wy:ow,x:ox,hit:false,sway:rand(0,6)});
  }
}
function update(){
  if(game!=='play') return;
  t+=1/60;
  let target=0;
  if(keys['ArrowLeft']||keys['a']) target-=1;
  if(keys['ArrowRight']||keys['d']) target+=1;
  if(mouseDown) target+=(mouseX - skier.x)/140;
  let acc= iceT>0?0.022:0.062;
  skier.edge+=(target - skier.edge)*acc;
  if(Math.abs(target)<0.05) skier.edge*= iceT>0?0.993:0.962;
  skier.edge=Math.max(-1.3,Math.min(1.3,skier.edge));
  skier.lean+=(skier.edge - skier.lean)*0.14;
  skier.base+=0.0009; if(skier.base>5.8) skier.base=5.8;
  let scrub=Math.abs(skier.edge)*0.52;
  let tuck=keys['s']||keys['ArrowDown'];
  skier.speed=Math.max(0.9, skier.base - scrub + (tuck?0.65:0));
  if(skier.crash>0) skier.speed*=0.35;
  let grip= iceT>0?0.05:0.155;
  skier.vx+= skier.edge * grip * skier.speed *0.21;
  skier.vx*=0.905;
  skier.x+=skier.vx;
  skier.x=Math.max(28,Math.min(W-28,skier.x));
  worldY+=skier.speed;
  if(t%0.08<0.02) tracks.push({x:skier.x,wy:worldY-15,a:1,rot:skier.lean});
  tracks.forEach(o=>o.a-=0.004); tracks=tracks.filter(o=>o.a>0);
  // gates
  for(let g of gates){
    if(g.passed) continue;
    let sy=skier.y + worldY - g.wy;
    if(Math.abs(sy - skier.y)<28){
      if(skier.x > g.left+16 && skier.x < g.right-16){ g.passed=true; gatesPassed++; }
      else if(sy <= skier.y+6){
        game='over'; document.getElementById('overlay').style.display='flex';
        document.getElementById('card').innerHTML=`<h1 style="color:#dc2626">GATE MISSED!</h1><p>Stay between red & blue.</p><p><b>${gatesPassed}</b> gates • ${Math.round(worldY)}m</p><button class="cta" onclick="location.reload()">RETRY ▶</button>`;
        return;
      }
    }
    if(g.wy < worldY - 90 && !g.passed){
      game='over'; document.getElementById('overlay').style.display='flex';
      document.getElementById('card').innerHTML=`<h1 style="color:#dc2626">GATE MISSED!</h1><p>${gatesPassed} gates cleared</p><button class="cta" onclick="location.reload()">RETRY ▶</button>`;
      return;
    }
  }
  for(let o of obstacles){
    if(o.hit) continue;
    let sy=skier.y + worldY - o.wy; if(Math.abs(sy - skier.y)>34) continue;
    let rad=o.type==='tree'?30:o.type==='ice'?48:20;
    if(Math.abs(skier.x - o.x) < rad){
      if(o.type==='ice'){ iceT=110; }
      else if(o.type==='mogul'){ skier.crash=14; }
      else { o.hit=true; skier.crash=42; skier.inv=70; skier.base=Math.max(2,skier.base-0.7); }
    }
  }
  if(skier.crash>0) skier.crash--; if(skier.inv>0) skier.inv--; if(iceT>0) iceT--;
  let last=gates.length?gates[gates.length-1].wy:0;
  while(last < worldY + H + 600){ last+=rand(500,700); spawn(last); }
  gates=gates.filter(g=>g.wy>worldY-300); obstacles=obstacles.filter(o=>o.wy>worldY-300);
}
function drawBackground(){
  // sky gradient
  let grad=ctx.createLinearGradient(0,0,0,260);
  grad.addColorStop(0,'#93c5fd'); grad.addColorStop(0.5,'#bfdbfe'); grad.addColorStop(1,'#e0f2fe');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,260);
  // distant mountains with parallax
  let mOff= (worldY*0.04)%40;
  ctx.fillStyle='#94a3b8'; ctx.beginPath();
  ctx.moveTo(-20+mOff,200); ctx.lineTo(70+mOff,110); ctx.lineTo(160+mOff,155); ctx.lineTo(270+mOff,95); ctx.lineTo(380+mOff,145); ctx.lineTo(500+mOff,105); ctx.lineTo(W+20,175); ctx.lineTo(W+20,0); ctx.lineTo(-20,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e2e8f0'; ctx.beginPath(); ctx.moveTo(70,110); ctx.lineTo(80,130); ctx.lineTo(60,130); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(270,95); ctx.lineTo(282,118); ctx.lineTo(258,118); ctx.closePath(); ctx.fill();
  // slope base - nice textured snow
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,170,W,H-170);
  // subtle side trees parallax - snowy forest edges
  for(let i=0;i<12;i++){
    let x = (i*90 + (worldY*0.2)%90) % (W+60) -30;
    let side = i%2===0? 0 : W;
    // left edge forest
    ctx.save(); ctx.translate(i%2===0? 18 + (i*7)%30 : W-18 - (i*7)%30, 200 + (i*60)%600);
    ctx.globalAlpha=0.18; ctx.fillStyle='#166534'; ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(-14,8); ctx.lineTo(14,8); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // light vignette
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(0,170,W,40);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  // tracks
  for(let tr of tracks){ let sy=skier.y + worldY - tr.wy; ctx.globalAlpha=tr.a*0.32; ctx.fillStyle='#94a3b8'; ctx.save(); ctx.translate(tr.x,sy); ctx.rotate(tr.rot*0.15); ctx.fillRect(-1.5,0,3,10); ctx.restore(); } ctx.globalAlpha=1;
  // obstacles
  for(let o of obstacles){
    let sy=skier.y + worldY - o.wy; if(sy<-80||sy>H+80) continue;
    ctx.save(); ctx.translate(o.x,sy);
    if(o.hit) ctx.globalAlpha=0.2;
    if(o.type==='tree'){
      ctx.fillStyle='#1f2937'; ctx.fillRect(-4,10,8,14);
      ctx.fillStyle='#15803d'; ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(-22,12); ctx.lineTo(22,12); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#16a34a'; ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(-14,0); ctx.lineTo(14,0); ctx.closePath(); ctx.fill();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(0,-28,5,0,6.28); ctx.fill();
    }else if(o.type==='rock'){
      ctx.fillStyle='#9ca3af'; ctx.beginPath(); ctx.ellipse(0,0,18,11,0,0,6.28); ctx.fill();
      ctx.fillStyle='#6b7280'; ctx.beginPath(); ctx.ellipse(-3,-2,6,4,0,0,6.28); ctx.fill();
    }else if(o.type==='snowman'){
      ctx.fillStyle='white'; ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,8,11,0,6.28); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-5,8,0,6.28); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-16,5.5,0,6.28); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fb923c'; ctx.beginPath(); ctx.moveTo(3,-16); ctx.lineTo(11,-15); ctx.lineTo(3,-13); ctx.fill();
    }else if(o.type==='ice'){
      ctx.fillStyle='rgba(186,230,253,0.85)'; ctx.strokeStyle='rgba(56,189,248,0.9)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(0,0,58,28,0,0,6.28); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-14,-6,16,7,-0.3,0,6.28); ctx.fill();
    }else if(o.type==='mogul'){
      ctx.fillStyle='#f8fafc'; ctx.beginPath(); ctx.ellipse(0,0,20,11,0,0,6.28); ctx.fill();
      ctx.fillStyle='#e2e8f0'; ctx.beginPath(); ctx.ellipse(0,4,16,5,0,0,6.28); ctx.fill();
    }
    ctx.restore();
  }
  // gates - BIG visible
  for(let g of gates){
    let sy=skier.y + worldY - g.wy; if(sy<-140||sy>H+140) continue;
    if(!g.passed){
      // carpet + glow
      ctx.fillStyle='rgba(14,165,233,0.14)'; ctx.fillRect(g.left-22,sy-22,g.gap+44,44);
      ctx.fillStyle='#0ea5e9'; ctx.fillRect(g.left,sy-5,g.gap,10);
      ctx.fillStyle='white'; ctx.beginPath(); ctx.moveTo(g.x,sy-14); ctx.lineTo(g.x-10,sy+8); ctx.lineTo(g.x+10,sy+8); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(14,165,233,0.35)'; ctx.setLineDash([14,10]); ctx.lineWidth=g.gap; ctx.beginPath(); ctx.moveTo(g.left,sy); ctx.lineTo(g.right,sy); ctx.stroke(); ctx.setLineDash([]);
    }
    for(let s of [{x:g.left,c:'#ef4444'},{x:g.right,c:'#3b82f6'}]){
      ctx.save(); ctx.translate(s.x,sy);
      ctx.fillStyle='#0f172a'; ctx.fillRect(-2.4,-40,4.8,56);
      ctx.fillStyle='#cbd5e1'; ctx.fillRect(-1,-40,2,56);
      if(!g.passed){
        ctx.fillStyle=s.c; ctx.shadowColor=s.c; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.moveTo(3,-40); ctx.lineTo(36,-30); ctx.lineTo(3,-20); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
        ctx.strokeStyle='white'; ctx.lineWidth=2.2; ctx.stroke();
      }
      ctx.restore();
    }
  }
  // skier
  ctx.save(); ctx.translate(skier.x,skier.y);
  if(skier.inv>0 && Math.floor(t*16)%2===0) ctx.globalAlpha=0.35;
  ctx.rotate(skier.lean*0.36);
  ctx.fillStyle='#0f172a'; ctx.fillRect(-17,13,34,5); ctx.fillRect(-17,21,34,5);
  ctx.fillStyle= iceT>0?'#7dd3fc':'#38bdf8'; ctx.fillRect(-17,13,34,2.5);
  ctx.fillStyle='#0ea5e9'; ctx.beginPath(); ctx.ellipse(0,-1,10,13,0,0,6.28); ctx.fill();
  ctx.fillStyle='#fde68a'; ctx.beginPath(); ctx.arc(0,-16,7.5,0,6.28); ctx.fill();
  ctx.fillStyle='#0f172a'; ctx.fillRect(-9,-6,18,3.5);
  if(Math.abs(skier.edge)>0.45 && skier.crash===0){
    ctx.fillStyle='rgba(255,255,255,0.9)'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(rand(-18,18),22+rand(0,10),rand(1,2.5),0,6.28); ctx.fill(); }
  }
  ctx.restore();
  // snow particles - nice slow fall
  for(let s of snow){
    s.y+=s.s + skier.speed*0.03; s.x+=s.d + skier.edge*0.3;
    if(s.y>H){ s.y=-8; s.x=rand(0,W); }
    ctx.globalAlpha=s.a; ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
  } ctx.globalAlpha=1;
  // speed lines when fast
  if(skier.speed>5.5){
    ctx.strokeStyle=`rgba(255,255,255,${(skier.speed-5.5)*0.07})`; ctx.lineWidth=2;
    for(let i=0;i<5;i++){ let x=rand(0,W); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+skier.vx*2.5, H); ctx.stroke(); }
  }
}
function loop(){ update(); draw(); document.getElementById('gc').textContent=gatesPassed; document.getElementById('sp').textContent=Math.round(skier?skier.speed*9:0); let nxt=gates.find(g=>!g.passed); if(nxt) document.getElementById('np').textContent=Math.max(0,Math.round(nxt.wy-worldY))+'m'; requestAnimationFrame(loop); }
function bind(){
  addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);
  const setM=e=>{ let r=canvas.getBoundingClientRect(); let cx=e.touches?e.touches[0].clientX:e.clientX; mouseX=(cx-r.left)*(W/r.width); };
  canvas.addEventListener('mousedown',e=>{mouseDown=true; setM(e);}); addEventListener('mouseup',()=>mouseDown=false);
  canvas.addEventListener('mousemove',setM);
  canvas.addEventListener('touchstart',e=>{mouseDown=true; setM(e);},{passive:false}); canvas.addEventListener('touchmove',e=>{setM(e); e.preventDefault();},{passive:false}); addEventListener('touchend',()=>mouseDown=false);
  const add=(id,k)=>{ let el=document.getElementById(id); el.addEventListener('touchstart',()=>keys[k]=true); el.addEventListener('touchend',()=>keys[k]=false); el.addEventListener('mousedown',()=>keys[k]=true); el.addEventListener('mouseup',()=>keys[k]=false); };
  add('L','ArrowLeft'); add('R','ArrowRight'); add('T','s');
  document.getElementById('play').addEventListener('click',()=>{ document.getElementById('overlay').style.display='none'; reset(); game='play'; });
}
bind(); reset(); loop();
</script>
</body>
</html>
