obi","Sahara","Arabian","Kalahari"],correct:1,explain:"Sahara ~9.2 million km². Antarctica is larger but it's a cold desert."},{q:"How many countries are officially in Africa? (UN count)",options:["52","54","58","47"],correct:1,explain:"54 recognized countries. If you count Western Sahara, some say 55."},{q:"Smallest country in the world by area?",options:["Monaco","San Marino","Vatican City","Liechtenstein"],correct:2,explain:"Vatican City - 44 hectares, 0.44 km², entirely within Rome."},{q:"Longest river in the world?",options:["Amazon","Nile","Yangtze","Mississippi"],correct:1,explain:"Nile ~6,650 km vs Amazon ~6,400 km. Debate continues, but Nile holds the textbook title."},{q:"Tokyo was formerly known as...",options:["Kyoto","Edo","Osaka","Nara"],correct:1,explain:"Edo was a small fishing village until Tokugawa made it his capital in 1603."},{q:"Currency of the United Kingdom?",options:["Euro","Pound Sterling","Dollar","Krone"],correct:1,explain:"Pound Sterling £ - oldest currency still in use, since 775 AD."},{q:"Which city is nicknamed 'The Big Apple'?",options:["Los Angeles","New York City","Chicago","Boston"],correct:1,explain:"Popularized by jazz musicians in the 1920s and a 1970s tourism campaign."},{q:"In which city would you find the Eiffel Tower?",options:["Lyon","Paris","Marseille","Nice"],correct:1,explain:"Paris, Champ de Mars. Built 1889, meant to be temporary. 7 million visitors/year now."},{q:"Morriston is famous for copper & tinplate heritage - it's in...",options:["Scotland","Wales, UK","Cornwall","Northern England"],correct:1,explain:"Morriston, Swansea, Wales - founded 1768 by Sir John Morris to house copper workers."}]},_t=[{key:"maps",title:"MAPS ONLY",sub:"THE ONLY MAP CATEGORY",icon:kr,color:"from-amber-300 to-orange-400",badge:"15 Qs • GIS • Mercator"},{key:"celebs",title:"CELEBRITIES",sub:"HOMETOWNS & POP CULTURE",icon:Hn,color:"from-fuchsia-300 to-pink-400",badge:"15 Qs • Stars • Tours"},{key:"general",title:"GENERAL KNOWLEDGE",sub:"CA
