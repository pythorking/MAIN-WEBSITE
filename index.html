<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>70  games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080a14'/%3E%3Cpath d='M16 5L26 11V21L16 27L6 21V11L16 5Z' stroke='%2300f5ff' stroke-width='1.8' fill='none'/%3E%3Cpath d='M12.5 11L21 16L12.5 21V11Z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a14;--panel:#121425;--border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.20);--cyan:#00f5ff;--pink:#ff2fd2;--violet:#8a5cff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:"Space Grotesk",system-ui;min-height:100vh;overflow-x:hidden}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(138,92,255,.18),transparent 60%),radial-gradient(800px 500px at 10% 0%,rgba(0,245,255,.14),transparent 60%),var(--bg)}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(22px) saturate(150%);background:linear-gradient(180deg,rgba(18,20,42,.96),rgba(10,12,24,.90));border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 12px 40px rgba(0,0,0,.4)}
.wrap{max-width:1760px;margin:0 auto;padding:0 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo-wrap{position:relative;width:54px;height:54px;flex:0 0 54px}
.logo-outer{position:absolute;inset:0;border-radius:14px;background:conic-gradient(from 180deg,var(--cyan),var(--violet),var(--pink),var(--cyan));box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 0 24px rgba(0,245,255,.35),0 0 48px rgba(255,47,210,.18);animation:logoSpin 12s linear infinite}
@keyframes logoSpin{to{transform:rotate(360deg)}}
.logo-inner{position:absolute;inset:2px;border-radius:12px;background:linear-gradient(180deg,#1e2142,#121325);display:grid;place-items:center;box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 20px rgba(0,0,0,.5)}
.logo-inner svg{filter:drop-shadow(0 0 10px rgba(0,245,255,.6))}
.logo-dot{position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 2px var(--bg),0 0 12px var(--cyan);animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.brand-text h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1} .brand-text h1 i{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-text p{margin:5px 0 0;font-family:"JetBrains Mono";font-size:10px;letter-spacing:.20em;opacity:.62;text-transform:uppercase;display:flex;gap:8px;align-items:center} .brand-text p span{width:20px;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);display:inline-block}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.searchBox{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.05));border:1px solid var(--border);border-radius:999px;padding:11px 16px;min-width:300px;transition:.2s;box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.searchBox:focus-within{border-color:rgba(0,245,255,.45);box-shadow:0 0 0 4px rgba(0,245,255,.12)} .searchBox input{background:transparent;border:0;outline:0;color:#fff;width:100%;font-size:13.5px}
.countPill{font-family:"JetBrains Mono";font-size:10.5px;background:rgba(0,245,255,.14);border:1px solid rgba(0,245,255,.34);color:var(--cyan);padding:7px 12px;border-radius:999px;font-weight:700}
.iconBtn,.favBtnHeader{font-family:"JetBrains Mono";font-size:11px;font-weight:700;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.05));border:1px solid var(--border);color:#fff;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.2s}
.iconBtn:hover{background:#fff;color:#000} .favBtnHeader.active{background:linear-gradient(90deg,var(--pink),var(--violet));border-color:rgba(255,47,210,.5)}
.pageLayout{display:grid;grid-template-columns:200px 1fr 280px;gap:18px;align-items:start;padding-top:20px}@media(max-width:1350px){.pageLayout{grid-template-columns:180px 1fr 260px}}@media(max-width:1000px){.pageLayout{grid-template-columns:1fr} .sidebar-left,.sidebar-right{display:none}}
.sidebar-left,.sidebar-right{position:sticky;top:88px;height:calc(100vh - 88px);overflow-y:auto;padding-bottom:120px;display:flex;flex-direction:column;gap:0;align-self:start;scrollbar-width:thin}
.sidebar-left{border-right:1px solid rgba(255,255,255,.06);padding-right:12px} .sidebar-right{border-left:1px solid rgba(255,255,255,.06);padding-left:12px}
.sideCard{background:linear-gradient(180deg,var(--panel),rgba(18,20,36,.6));border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 10px 30px rgba(0,0,0,.25);flex-shrink:0}
.sideCard h4{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.16em;opacity:.58;margin:0 0 12px;text-transform:uppercase;display:flex;align-items:center;gap:8px} .sideCard h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.leftNav{display:flex;flex-direction:column;gap:7px} .leftNav button{text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--border);color:rgba(255,255,255,.85);padding:11px 12px;border-radius:12px;font-family:"JetBrains Mono";font-size:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center} .leftNav button.active{background:linear-gradient(90deg,var(--cyan),#7dfffd);color:#001517;border-color:rgba(0,245,255,.5);box-shadow:0 0 20px rgba(0,245,255,.3);font-weight:700}
.sideGame{display:flex;gap:11px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;transition:.2s;border:1px solid transparent} .sideGame:hover{background:rgba(255,255,255,.06);border-color:var(--border);transform:translateX(2px)} .sIcon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,rgba(0,245,255,.22),rgba(255,47,210,.18));border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;flex:0 0 44px} .sideGame b{font-size:12.5px;display:block} .sideGame span{font-family:"JetBrains Mono";font-size:9.5px;opacity:.52}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:4px} .filters{display:flex;gap:7px;flex-wrap:wrap} .fBtn{font-family:"JetBrains Mono";font-size:10.5px;font-weight:700;border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));color:#fff;padding:8px 13px;border-radius:999px;cursor:pointer} .fBtn.active{background:linear-gradient(90deg,var(--cyan),#7dfffd);color:#001517;border-color:rgba(0,245,255,.55)}
.sortSel{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid var(--border);color:#fff;border-radius:999px;padding:7px 12px;font-family:"JetBrains Mono";font-size:10.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;padding:16px 0 44px}
.card{position:relative;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:20px;padding:1px;cursor:pointer;transition:.3s;overflow:hidden} .card:hover{transform:translateY(-6px) scale(1.01);border-color:rgba(0,245,255,.28);box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 30px rgba(0,245,255,.12)} .card::before{content:"";position:absolute;inset:-1px;background:linear-gradient(135deg,rgba(0,245,255,.7),rgba(255,47,210,.45));opacity:0;transition:.3s} .card:hover::before{opacity:1}
.card-inner{position:relative;z-index:1;background:radial-gradient(500px 260px at 30% -20%,rgba(255,255,255,.11),transparent),linear-gradient(180deg,#1c1f3e,#121325);border-radius:19px;padding:15px;min-height:168px;display:flex;flex-direction:column}
.icon{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,rgba(0,245,255,.24),rgba(255,47,210,.20));border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:26px} .title{font-weight:700;font-size:13.5px;margin:12px 0 4px;min-height:36px} .sub{font-family:"JetBrains Mono";font-size:9.5px;opacity:.44} .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:11px;border-top:1px solid rgba(255,255,255,.06);margin-top:12px} .kb{font-family:"JetBrains Mono";font-size:9.5px;opacity:.5} .playBtn{font-size:9.5px;font-weight:800;background:linear-gradient(90deg,var(--cyan),#7dfffd);color:#001517;padding:6px 11px;border-radius:999px}
.favBtn{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;cursor:pointer;z-index:2;transition:.2s;font-size:14px;color:#fff} .favBtn.active{background:linear-gradient(90deg,var(--pink),var(--violet));border-color:rgba(255,47,210,.5);box-shadow:0 0 16px rgba(255,47,210,.45)}
.adBreak{grid-column:1 / -1;border-radius:20px;border:1px solid rgba(0,245,255,.32);background:linear-gradient(135deg,rgba(0,245,255,.14),rgba(255,47,210,.14),rgba(138,92,255,.14));padding:1px;margin:12px 0}
.adBreakInner{background:radial-gradient(700px 320px at 15% 0%,rgba(0,245,255,.18),transparent),linear-gradient(180deg,#1e2146,#121326);border-radius:19px;padding:18px;display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center;position:relative}
.adBadge{position:absolute;top:10px;left:12px;font-family:"JetBrains Mono";font-size:8.5px;letter-spacing:.14em;background:rgba(0,245,255,.18);border:1px solid rgba(0,245,255,.38);color:var(--cyan);padding:4px 8px;border-radius:999px;font-weight:700}
.adIcon{width:80px;height:80px;border-radius:18px;background:linear-gradient(135deg,rgba(0,245,255,.26),rgba(255,47,210,.22));border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font-size:38px}
.adContent h4{margin:20px 0 4px;font-size:18px;font-weight:800} .adContent p{margin:0;font-size:12.8px;opacity:.66;line-height:1.55;max-width:520px} .adTag{font-family:"JetBrains Mono";font-size:9px;background:rgba(255,255,255,.08);border:1px solid var(--border);padding:4px 8px;border-radius:999px}
.adPlay{background:linear-gradient(90deg,var(--cyan),#7dfffd);color:#001517;border:0;padding:12px 22px;border-radius:999px;font-weight:800;font-size:11.5px;cursor:pointer;box-shadow:0 0 26px rgba(0,245,255,.42)}
#noResults{display:none;padding:48px;text-align:center;border:1px dashed var(--border);border-radius:20px;background:rgba(255,255,255,.03)}
#overlay{position:fixed;inset:0;z-index:100;background:rgba(4,5,10,.94);backdrop-filter:blur(20px);display:none;flex-direction:column}#overlay.open{display:flex} #overlayTop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,rgba(0,245,255,.10),rgba(255,47,210,.08))} #overlayActions{display:flex;gap:8px} #overlayActions button{font-family:"JetBrains Mono";font-size:11px;background:rgba(255,255,255,.09);border:1px solid var(--border);color:#fff;border-radius:999px;padding:9px 14px;cursor:pointer} #overlayActions button.primary{background:linear-gradient(90deg,var(--cyan),#7dfffd);color:#001517;font-weight:800}
#frameWrap{flex:1;position:relative;background:#000}#gameFrame{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{grid-column:1 / -1;border-top:1px solid var(--border);padding:20px 0;color:rgba(255,255,255,.5);font-family:"JetBrains Mono";font-size:10.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:10px} footer a{color:var(--cyan);text-decoration:none} footer a:hover{text-decoration:underline}
.modal{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);display:none;place-items:center;padding:20px} .modal.open{display:grid} .modalBox{max-width:560px;width:100%;background:linear-gradient(180deg,#1c1f3e,#121325);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)} .modalBox h3{margin:0 0 10px;font-size:20px} .modalBox p{opacity:.72;font-size:13.5px;line-height:1.6} .modalBox .closeM{margin-top:16px;background:#fff;color:#000;border:0;padding:10px 16px;border-radius:999px;font-family:"JetBrains Mono";font-size:11px;font-weight:700;cursor:pointer}
.mobileBar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:linear-gradient(180deg,rgba(18,20,42,.96),rgba(10,12,24,.98));border-top:1px solid var(--border);padding:10px 12px;backdrop-filter:blur(16px)}@media(max-width:1000px){.mobileBar{display:flex;gap:8px;overflow:auto}}
.mChip{flex:0 0 auto;background:rgba(255,255,255,.07);border:1px solid var(--border);color:#fff;padding:8px 14px;border-radius:999px;font-family:"JetBrains Mono";font-size:11px;white-space:nowrap} .mChip.active{background:linear-gradient(90deg,var(--cyan),#7dfffd);color:#001517}

.previewWrap{width:100%;height:116px;border-radius:12px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 20px rgba(0,0,0,.35);isolation:isolate;background:#0e1026}
.previewBg{position:absolute;inset:0;opacity:1;transition:.3s}
.previewStatic{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;filter:drop-shadow(0 0 18px rgba(255,255,255,.25));transition:.25s;transform:scale(1)}
.card:hover .previewStatic{transform:scale(1.12) rotate(-3deg)}
.previewPattern{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(circle at 30% 30%,white 1.5px,transparent 1.6px),radial-gradient(circle at 70% 60%,white 1px,transparent 1.2px);background-size:22px 22px, 34px 34px;mix-blend-mode:overlay}
.previewFrame{width:400px;height:280px;border:0;transform:scale(0.285);transform-origin:top left;pointer-events:none;position:absolute;top:0;left:0;filter:saturate(1.2) contrast(1.08);opacity:0;transition:opacity .25s}
.previewFrame.loaded{opacity:1}
.previewShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(12,13,26,.88) 100%);pointer-events:none}
.previewBadge{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 8px;font-size:14px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.previewTop{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.previewDot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.card:hover .previewBg{filter:brightness(1.18)}
