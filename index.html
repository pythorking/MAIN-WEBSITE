<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>70  games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080a14'/%3E%3Cpath d='M16 5L26 11V21L16 27L6 21V11L16 5Z' stroke='%2300f5ff' stroke-width='1.8' fill='none'/%3E%3Cpath d='M12.5 11L21 16L12.5 21V11Z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a14;--panel:#121425;--border:rgba(255,255,255,.12);--cyan:#00f5ff;--pink:#ff2fd2;--violet:#8a5cff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:"Space Grotesk",system-ui;min-height:100vh;overflow-x:hidden}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(138,92,255,.18),transparent 60%),radial-gradient(800px 500px at 10% 0%,rgba(0,245,255,.14),transparent 60%),var(--bg)}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(22px);background:linear-gradient(180deg,rgba(18,20,42,.96),rgba(10,12,24,.90));border-bottom:1px solid var(--border)}
.wrap{max-width:1760px;margin:0 auto;padding:0 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo-wrap{position:relative;width:54px;height:54px;flex:0 0 54px}
.logo-outer{position:absolute;inset:0;border-radius:14px;background:conic-gradient(from 180deg,var(--cyan),var(--violet),var(--pink),var(--cyan));animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-inner{position:absolute;inset:2px;border-radius:12px;background:linear-gradient(180deg,#1e2142,#121325);display:grid;place-items:center}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.searchBox{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:999px;padding:11px 16px;min-width:300px}
.searchBox input{background:transparent;border:0;outline:0;color:#fff;width:100%;font-size:13.5px}
.countPill{font-family:"JetBrains Mono";font-size:10.5px;background:rgba(0,245,255,.14);border:1px solid rgba(0,245,255,.34);color:var(--cyan);padding:7px 12px;border-radius:999px;font-weight:700}
.iconBtn,.favBtnHeader{font-family:"JetBrains Mono";font-size:11px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--border);color:#fff;padding:9px 14px;border-radius:999px;cursor:pointer}
.pageLayout{display:grid;grid-template-columns:200px 1fr 280px;gap:18px;align-items:start;padding-top:20px}
@media(max-width:1000px){.pageLayout{grid-template-columns:1fr} .sidebar-left,.sidebar-right{display:none}}
.sidebar-left,.sidebar-right{position:sticky;top:88px;height:calc(100vh - 88px);overflow-y:auto;padding-bottom:120px;display:flex;flex-direction:column}
.sidebar-left{border-right:1px solid rgba(255,255,255,.06);padding-right:12px} .sidebar-right{border-left:1px solid rgba(255,255,255,.06);padding-left:12px}
.sideCard{background:linear-gradient(180deg,var(--panel),rgba(18,20,36,.6));border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px}
.sideCard h4{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.16em;opacity:.58;margin:0 0 12px;text-transform:uppercase}
.leftNav{display:flex;flex-direction:column;gap:7px} .leftNav button{text-align:left;background:rgba(255,255,255,.05);border:1px solid var(--border);color:#fff;padding:11px 12px;border-radius:12px;font-family:"JetBrains Mono";font-size:11px;cursor:pointer}
.leftNav button.active{background:linear-gradient(90deg,var(--cyan),#7dfffd);color:#001517}
.sideGame{display:flex;gap:11px;align-items:center;padding:10px;border-radius:12px;cursor:pointer} .sideGame:hover{background:rgba(255,255,255,.06)}
.sIcon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,rgba(0,245,255,.22),rgba(255,47,210,.18));display:grid;place-items:center;font-size:20px;flex:0 0 44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;padding:16px 0 44px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:20px;padding:1px;cursor:pointer;transition:.3s;overflow:hidden;text-align:left}
.card:hover{transform:translateY(-4px);border-color:rgba(0,245,255,.28)}
.card-inner{position:relative;background:linear-gradient(180deg,#1c1f3e,#121325);border-radius:19px;padding:14px;min-height:160px;display:flex;flex-direction:column}
.previewWrap{width:100%;height:110px;border-radius:12px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.14);background:#0e1026}
.previewBg{position:absolute;inset:0}
.previewStatic{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.previewShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(12,13,26,.88) 100%)}
.previewBadge{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 8px;font-size:14px}
.title{font-weight:700;font-size:13.5px;margin:12px 0 4px;min-height:36px} .sub{font-family:"JetBrains Mono";font-size:9.5px;opacity:.44}
.meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:11px;border-top:1px solid rgba(255,255,255,.06);margin-top:12px}
.playBtn{font-size:9.5px;font-weight:800;background:linear-gradient(90deg,var(--cyan),#7dfffd);color:#001517;padding:6px 11px;border-radius:999px}
.favBtn{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;cursor:pointer;z-index:2;font-size:14px;color:#fff}
.favBtn.active{background:linear-gradient(90deg,var(--pink),var(--violet))}
.adBreak{grid-column:1 / -1;border-radius:20px;border:1px solid rgba(0,245,255,.32);background:linear-gradient(135deg,rgba(0,245,255,.14),rgba(255,47,210,.14));padding:1px;margin:12px 0}
.adBreakInner{background:linear-gradient(180deg,#1e2146,#121326);border-radius:19px;padding:18px;display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center}
#overlay{position:fixed;inset:0;z-index:100;background:rgba(4,5,10,.94);backdrop-filter:blur(20px);display:none;flex-direction:column}#overlay.open{display:flex}
#overlayTop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
#frameWrap{flex:1;position:relative;background:#000}#gameFrame{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{grid-column:1 / -1;border-top:1px solid var(--border);padding:20px 0;color:rgba(255,255,255,.5);font-family:"JetBrains Mono";font-size:10.5px;display:flex;justify-content:space-between;flex-wrap:wrap}
</style>
</head>
<body>
<header><div class="wrap"><div class="topbar"><div class="brand"><div class="logo-wrap"><div class="logo-outer"></div><div class="logo-inner"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 3.5L22.5 9V19L14 24.5L5.5 19V9L14 3.5Z" stroke="#00f5ff" stroke-width="1.6" fill="none"/><path d="M11.2 9.8L19 14L11.2 18.2V9.8Z" fill="white"/></svg></div></div><div><h1 style="margin:0;font-size:23px;font-weight:800"><i style="font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent">NEON</i> ARCADE</h1><p style="margin:5px 0 0;font-family:JetBrains Mono;font-size:10px;letter-spacing:.2em;opacity:.62">DEFINED • 70 GAMES • GITHUB READY</p></div></div><div class="controls"><div class="searchBox">🔍 <input id="searchInput" placeholder="Search 70 games…"></div><span class="countPill" id="countLabel">70 GAMES</span><button class="favBtnHeader" id="favHeaderBtn">⭐ Favorites</button></div></div></div></header>
<main class="wrap"><div class="pageLayout">
<aside class="sidebar-left"><div class="sideCard"><h4>Navigation</h4><div class="leftNav" id="leftNav"><button class="active" data-cat="all">All Games <span>70</span></button><button data-cat="popular">Popular</button><button data-cat="puzzle">Puzzle</button><button data-cat="action">Action</button><button data-cat="fav">⭐ Favorites</button><button data-cat="trending">🔥 Trending</button></div></div><div class="sideCard"><h4>Stats</h4><div style="font-family:JetBrains Mono;font-size:11px;line-height:1.9;opacity:.75" id="statsLeft"></div></div><div class="sideCard"><h4>Recently Played</h4><div id="recentLeft"></div></div></aside>
<div class="centerCol"><div class="grid" id="grid"></div><footer><span>© NEON ARCADE • 70 games • <a href="#" id="aboutLink" style="color:var(--cyan)">About</a></span><span id="footerCount"></span></footer></div>
<aside class="sidebar-right"><div class="sideCard"><h4>Featured</h4><div id="featuredSide"></div></div><div class="sideCard"><h4>🔥 Trending</h4><div id="trendingSide"></div></div><div class="sideCard"><h4>Continue Playing</h4><div id="continueSide"></div></div></aside>
</div></main>
<div id="overlay"><div id="overlayTop"><div id="overlayTitle">Game</div><div style="display:flex;gap:8px"><button class="iconBtn" id="shareGameBtn">🔗 Share</button><button class="iconBtn" id="closeBtn">✕ Close</button></div></div><div id="frameWrap"><iframe id="gameFrame" allow="fullscreen; gamepad; autoplay"></iframe></div></div>
<script>
let GAMES=[];
let favorites=JSON.parse(localStorage.getItem('neon_favs')||'[]');
let recents=JSON.parse(localStorage.getItem('neon_recents')||'[]');
let playCounts=JSON.parse(localStorage.getItem('neon_counts')||'{}');
const FEATURED_SLUGS=["nebula-mancala","disco-chess-full-rules","hotwire-maze","dominoes-neo-tokyo","galactic-asteroids","deep-sea-pipe-panic"];
let activeCat='all';
function getCats(slug,title){const s=(slug+' '+title).toLowerCase();let cats=[];if(/flappy|tetris|2048|pong|breakout|asteroids|pool|blackjack|zuma|snake|tank|chess|dino|bowling|archery/.test(s)) cats.push('popular');if(/maze|flow|stack|quartet|keys|vault|word|search|shuffle|curling|plinko|puzzle|typing|match|checkers|mancala|domino|mahjong|pipe|monogram|klondike|bridge|builder|darts/.test(s)) cats.push('puzzle');if(/blackjack|poker|slots|holdem|royal|8ball|plinko|peggle|casino|kiddy|mancala|domino|mahjong|klondike|bowling|darts/.test(s)) cats.push('casino');if(/dash|parkour|invaders|kaboom|goblin|kong|jungle|geo|oby|nova|dino|pit|toxic|hop|sky|tank|surf|runway|madness|bowling|slalom|flappy|archery|rush|jump|highway/.test(s)) cats.push('action');if(/pizza|zoo|barnyard|vaporwave|neon|fun|disco|bodega|sea|hawaii/.test(s)) cats.push('fun');if(cats.length===0) cats.push('arcade');return cats;}
function getFeatured(){return FEATURED_SLUGS.map(s=>GAMES.find(g=>g.slug===s)).filter(Boolean);}
function getTrending(){return [...GAMES].sort((a,b)=>(playCounts[b.slug]||0)-(playCounts[a.slug]||0)).slice(0,12);}
async function loadGames(){
  const res=await fetch('games.json');GAMES=await res.json();
  renderGrid();renderSidebars();
  const params=new URLSearchParams(window.location.search);const direct=params.get('game');if(direct&&GAMES.some(g=>g.slug===direct)) setTimeout(()=>play(direct,false),400);
}
function renderGrid(){
  const grid=document.getElementById('grid');grid.innerHTML='';
  let list=[...GAMES];const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  let filtered=list.filter(g=>{
    const cats=getCats(g.slug,g.title).join(' ');const isFav=favorites.includes(g.slug);const catsWithFav=cats+(isFav?' fav':'');const okQ=!q||g.title.toLowerCase().includes(q)||g.slug.includes(q)||cats.includes(q);let okC=true;if(activeCat==='fav') okC=isFav;else if(activeCat==='trending') okC=(playCounts[g.slug]||0)>0||getTrending().some(t=>t.slug===g.slug);else if(activeCat!=='all') okC=catsWithFav.includes(activeCat);return okQ&&okC;
  });
  if(activeCat==='trending'&&filtered.length===0) filtered=getTrending();
  const featured=getFeatured();const shouldShowAds=activeCat==='all'&&!q;let countSinceAd=0,adIndex=0;
  filtered.forEach((g,idx)=>{
    const cats=getCats(g.slug,g.title);const hash=g.slug.split('').reduce((a,c)=>a+c.charCodeAt(0),0);const hues=[190,285,320,45,150,260,10,200];const h1=hues[hash%hues.length];const h2=hues[(hash+3)%hues.length];const grad='linear-gradient(135deg, hsl('+h1+' 90% 62% / .38), hsl('+h2+' 90% 62% / .28))';const isFav=favorites.includes(g.slug);
    const btn=document.createElement('button');btn.className='card';btn.dataset.slug=g.slug;
    btn.innerHTML='<button class="favBtn '+(isFav?'active':'')+'" data-fav="'+g.slug+'">'+(isFav?'★':'☆')+'</button><div class="card-inner"><div class="previewWrap"><div class="previewBg" style="background:'+grad+'"></div><div class="previewStatic">'+g.avatar+'</div><div class="previewShade"></div><div class="previewBadge">'+g.avatar+'</div></div><div class="title">'+g.title+'</div><div class="sub">'+g.slug+'</div><div class="meta"><span style="font-family:JetBrains Mono;font-size:9.5px;opacity:.5">'+cats[0]+' • '+(playCounts[g.slug]||0)+' plays</span><span class="playBtn">▶ PLAY</span></div></div>';
    grid.appendChild(btn);countSinceAd++;if(shouldShowAds&&countSinceAd>=20&&adIndex<3){const fg=featured[adIndex%featured.length];if(fg){const ad=document.createElement('div');ad.className='adBreak';ad.innerHTML='<div class="adBreakInner"><div style="width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,rgba(0,245,255,.3),rgba(255,47,210,.25));display:grid;place-items:center;font-size:28px">'+fg.avatar+'</div><div><b>'+fg.title+' — Featured</b><div style="opacity:.6;font-size:12px">Break '+(adIndex+1)+' at '+(adIndex+1)*20+'</div></div><div><button class="iconBtn" data-play="'+fg.slug+'">▶ PLAY</button></div></div>';grid.appendChild(ad);countSinceAd=0;adIndex++;}}
  });
  document.getElementById('countLabel').textContent=filtered.length+' GAMES';document.getElementById('footerCount').textContent=filtered.length+' / '+GAMES.length;
  document.getElementById('statsLeft').innerHTML=GAMES.length+' games<br>'+favorites.length+' favs<br>'+recents.length+' recents<br>'+Object.keys(playCounts).length+' played';
}
function renderSidebars(){
  const featured=getFeatured();const trending=getTrending();
  document.getElementById('featuredSide').innerHTML=featured.slice(0,4).map(g=>'<div class="sideGame" data-slug="'+g.slug+'"><div class="sIcon">'+g.avatar+'</div><div><b>'+g.title+'</b><span>Featured</span></div></div>').join('');
  document.getElementById('trendingSide').innerHTML=trending.map(g=>'<div class="sideGame" data-slug="'+g.slug+'"><div class="sIcon">'+g.avatar+'</div><div><b>'+g.title+'</b><span>'+(playCounts[g.slug]||0)+' plays</span></div></div>').join('')||'No trending yet';
  document.getElementById('recentLeft').innerHTML=recents.length?recents.slice(0,8).map(s=>{const g=GAMES.find(x=>x.slug===s);return g?'<div class="sideGame" data-slug="'+g.slug+'"><div class="sIcon">'+g.avatar+'</div><div><b>'+g.title+'</b><span>Recent</span></div></div>':'';}).join(''):'No recent';
  document.getElementById('continueSide').innerHTML=recents.length?recents.map(s=>{const g=GAMES.find(x=>x.slug===s);return g?'<div class="sideGame" data-slug="'+g.slug+'"><div class="sIcon">'+g.avatar+'</div><div><b>'+g.title+'</b><span>Continue</span></div></div>':'';}).join(''):'Play a game';
}
function play(s,pushUrl=true){
  const g=GAMES.find(x=>x.slug===s);if(!g)return;
  playCounts[s]=(playCounts[s]||0)+1;localStorage.setItem('neon_counts',JSON.stringify(playCounts));
  document.getElementById('overlayTitle').textContent=g.avatar+' '+g.title;
  document.getElementById('gameFrame').src=g.file;
  document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden';
  recents=recents.filter(x=>x!==s);recents.unshift(s);recents=recents.slice(0,12);localStorage.setItem('neon_recents',JSON.stringify(recents));
  if(pushUrl){const url=new URL(window.location);url.searchParams.set('game',s);history.pushState({},'',url);}
  renderSidebars();
}
function close(){document.getElementById('gameFrame').src='about:blank';document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';const url=new URL(window.location);url.searchParams.delete('game');history.pushState({},'',url);}
document.addEventListener('DOMContentLoaded',()=>{
  loadGames();
  document.getElementById('grid').addEventListener('click',e=>{
    const fav=e.target.closest('.favBtn');if(fav){e.stopPropagation();const slug=fav.dataset.fav;if(favorites.includes(slug)) favorites=favorites.filter(x=>x!==slug);else favorites.push(slug);localStorage.setItem('neon_favs',JSON.stringify(favorites));renderGrid();renderSidebars();return;}
    const ad=e.target.closest('[data-play]');if(ad){play(ad.dataset.play);return;}
    const c=e.target.closest('.card');if(c) play(c.dataset.slug);
  });
  document.querySelectorAll('.sidebar-left, .sidebar-right').forEach(el=>{el.addEventListener('click',e=>{const sg=e.target.closest('.sideGame');if(sg) play(sg.dataset.slug);});});
  document.getElementById('closeBtn').addEventListener('click',close);
  document.getElementById('searchInput').addEventListener('input',renderGrid);
  document.querySelectorAll('.leftNav button').forEach(b=>{b.addEventListener('click',()=>{activeCat=b.dataset.cat;document.querySelectorAll('.leftNav button').forEach(x=>x.classList.toggle('active',x.dataset.cat===activeCat));renderGrid();});});
});
</script>
</body>
</html>
